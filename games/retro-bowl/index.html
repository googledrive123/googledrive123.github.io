<!DOCTYPE html>
<html lang="en">
    <head>
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta http-equiv="pragma" content="no-cache"/>
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta charset="utf-8"/>
        <title>Retro Bowl - SGGames</title>
        <!-- Base URL routes all relative asset fetches to CDN (no local game files needed) -->
        <base href="https://cdn.jsdelivr.net/gh/ThatsMyMute/retro-bowl@main/">
        <!-- Absolute path — not affected by base href -->
        <script src="/js/mimicry.js"></script>
        <style>
            body {
              background: #000;
              color: #cccccc;
              margin: 0;
              padding: 0;
              border: 0;
              overflow: hidden;
            }
            canvas {
              image-rendering: optimizeSpeed;
              -webkit-interpolation-mode: nearest-neighbor;
              -ms-touch-action: none;
              margin: 0;
              padding: 0;
              border: 0;
              display: block;
            }
            :-webkit-full-screen {
              width: 100%;
              height: 100%;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas">
            <p>Your browser doesn't support HTML5 canvas.</p>
        </canvas>
        <script>
            document.querySelector('canvas').width = window.innerWidth;
            document.querySelector('canvas').height = window.innerHeight;
        </script>
        <!-- js/main.js resolves via base href to cdn.jsdelivr.net/gh/ThatsMyMute/retro-bowl@main/js/main.js -->
        <script type="text/javascript" src="js/main.js"></script>
        <script>window.onload = GameMaker_Init;</script>
    </body>
</html>
