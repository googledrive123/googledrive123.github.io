<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Blend · GameVault preview</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --h: 25; --c: 1; --ah: 25;
    --ink: 0.97 calc(0.015 * var(--c)) var(--h);
    --ring: 0.95 calc(0.03 * var(--c)) var(--h);
    --bg: oklch(0.15 calc(0.04 * var(--c)) var(--h));
    --tx: oklch(var(--ink));
    --mu: oklch(var(--ink) / 0.6);
    --s1: oklch(0.24 calc(0.06 * var(--c)) var(--h));
    --s2: oklch(0.3 calc(0.07 * var(--c)) var(--h));
    --on: oklch(0.3 calc(0.07 * var(--c)) var(--h) / 0.75);
    --hv: oklch(0.3 calc(0.07 * var(--c)) var(--h) / 0.6);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Onest', system-ui, sans-serif; }
  a { color: inherit; }
  button { font: inherit; color: inherit; }
  input::placeholder { color: currentColor; opacity: .5; }

  .scr { position: relative; height: 100vh; min-height: 635px; overflow: hidden; background: var(--bg); }
  .fog-a, .fog-b { position: absolute; border-radius: 50%; filter: blur(40px); pointer-events: none; }
  .fog-a { left: -180px; top: 240px; width: 620px; height: 620px; background: radial-gradient(circle, oklch(0.5 calc(0.16 * var(--c)) var(--h) / 0.45), transparent 65%); }
  .fog-b { right: -140px; top: -220px; width: 600px; height: 600px; background: radial-gradient(circle, oklch(0.46 calc(0.14 * var(--c)) calc(var(--h) + 30) / 0.42), transparent 65%); }
  .fog-grid { position: absolute; inset: 0; pointer-events: none; background-image: linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px); background-size: 22px 22px; -webkit-mask-image: radial-gradient(circle at center, black 10%, transparent 70%); mask-image: radial-gradient(circle at center, black 10%, transparent 70%); }

  .bar { position: absolute; z-index: 3; left: 50%; top: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 2px; height: 52px; padding: 0 5px; border-radius: 20px; background: oklch(0.2 calc(0.05 * var(--c)) var(--h) / 0.4); border: 1px solid oklch(var(--ring) / 0.12); backdrop-filter: blur(12px); white-space: nowrap; }
  .bar-home { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 15px; padding: 0; background: var(--on); cursor: pointer; }
  .bar-home img { width: 24px; height: 24px; display: block; }
  .bar-sep { width: 2px; height: 22px; margin: 0 4px; border-radius: 1px; background: oklch(var(--ring) / 0.14); }
  .bar-link { height: 42px; padding: 0 14px 0 11px; display: flex; align-items: center; gap: 8px; border: 0; border-radius: 15px; background: transparent; color: oklch(var(--ink) / 0.75); font-size: 14px; font-weight: 500; text-decoration: none; cursor: pointer; }
  .bar-link[data-soon]:hover { background: var(--hv); color: var(--tx); }
  .bar-games { color: var(--tx); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: oklch(0.72 0.17 var(--ah)); }
  .bar-icon { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 15px; padding: 0; background: transparent; color: oklch(var(--ink) / 0.75); cursor: pointer; }
  .bar-icon:hover { background: var(--hv); }
  .bar-avatar { width: 34px; height: 34px; margin: 0 4px 0 2px; display: grid; place-items: center; border: 0; border-radius: 50%; padding: 0; background: var(--s2); font-size: 13px; font-weight: 600; cursor: pointer; }

  .home { position: absolute; inset: 0; }
  .hero { position: absolute; left: 50%; top: 104px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; text-align: center; }
  .brand { margin: 0; font-size: 78px; font-weight: 600; letter-spacing: -0.045em; line-height: 1.05; background: linear-gradient(180deg, oklch(0.98 calc(0.01 * var(--c)) var(--h)) 30%, oklch(0.8 0.1 var(--ah))); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .period { margin: 10px 0 0; display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--mu); }
  .period-time { font-variant-numeric: tabular-nums; color: var(--tx); }
  .period-bar { display: block; width: 44px; height: 4px; border-radius: 2px; background: oklch(var(--ring) / 0.16); overflow: hidden; }
  .period-fill { display: block; height: 100%; background: var(--tx); }

  .search { margin-top: 28px; display: flex; align-items: center; gap: 12px; width: 520px; height: 52px; padding: 0 12px 0 20px; border-radius: 20px; background: oklch(var(--ink) / 0.05); box-shadow: 0 0 0 1px oklch(var(--ring) / 0.15), 0 16px 32px rgba(0, 0, 0, 0.14); }
  .search svg { flex-shrink: 0; opacity: .7; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: inherit; font-family: inherit; font-size: 15px; }
  .kbd { font-size: 12px; opacity: .6; border-radius: 7px; padding: 2px 8px; box-shadow: 0 0 0 1px oklch(var(--ring) / 0.2); }

  .jump-lbl { margin-top: 40px; font-size: 13px; color: var(--mu); }
  .row { margin-top: 12px; display: flex; gap: 12px; }
  .gt { position: relative; display: block; overflow: hidden; background: var(--s1); text-decoration: none; cursor: pointer; }
  .gt img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gt-name { position: absolute; color: #fff; text-align: left; opacity: 0; transform: translateY(10px); }
  .rt { width: 126px; height: 84px; border-radius: 16px; box-shadow: 0 0 0 1px oklch(var(--ring) / 0.1); }
  .rt .gt-name { left: 10px; right: 10px; bottom: 8px; font-size: 12px; font-weight: 600; line-height: 1.2; }
</style>
</head>
<body>
<main class="scr" id="scr">
  <div class="fog-a"></div>
  <div class="fog-b"></div>
  <div class="fog-grid"></div>
  <nav class="bar" aria-label="Main">
    <button class="bar-home" id="goHome" type="button" title="Home" aria-label="Home"><img src="/favicon.svg" alt=""></button>
    <span class="bar-sep"></span>
    <button class="bar-link bar-games" id="openGames" type="button" aria-haspopup="dialog"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="4"></rect><path d="M8 11v3M6.5 12.5h3"></path><circle cx="15.5" cy="12" r="1"></circle><circle cx="17.5" cy="14" r="1"></circle></svg>games</button>
    <a class="bar-link" href="#" data-soon><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>movies</a>
    <a class="bar-link" href="#" data-soon><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>music</a>
    <a class="bar-link" href="#" data-soon><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"></path></svg>chat<span class="dot"></span></a>
    <a class="bar-link" href="#" data-soon><svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"></circle><circle cx="12" cy="5" r="2"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle></svg>more</a>
    <span class="bar-sep"></span>
    <button class="bar-icon" type="button" title="Settings" aria-label="Settings" data-soon><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg></button>
    <button class="bar-avatar" type="button" title="Profile" data-soon>M</button>
  </nav>
  <div class="home" id="home">
    <div class="hero">
      <h1 class="brand">gamevault</h1>
      <p class="period">period 3 ends in <span class="period-time" id="timer">23:41</span><span class="period-bar"><span class="period-fill" id="timerBar" style="width:52.6%"></span></span></p>
      <label class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="homeQ" placeholder="search 1,958 games" aria-label="Search games" autocomplete="off" spellcheck="false">
        <span class="kbd" aria-hidden="true">/</span>
      </label>
      <div class="jump-lbl">jump back in</div>
      <div class="row">
        <a class="gt rt" href="#" data-soon><img src="/thumbs/slope2.webp" alt=""><span class="gt-name">Slope 2</span></a>
        <a class="gt rt" href="#" data-soon><img src="/thumbs/drivemad.webp" alt=""><span class="gt-name">Drive Mad</span></a>
        <a class="gt rt" href="#" data-soon><img src="/thumbs/retro-bowl.webp" alt=""><span class="gt-name">Retro Bowl</span></a>
        <a class="gt rt" href="#" data-soon><img src="/thumbs/geometrydash.webp" alt=""><span class="gt-name">Geometry Dash</span></a>
        <a class="gt rt" href="#" data-soon><img src="/thumbs/1v1lol.webp" alt=""><span class="gt-name">1v1.LOL</span></a>
        <a class="gt rt" href="#" data-soon><img src="/thumbs/cuphead.webp" alt=""><span class="gt-name">Cuphead</span></a>
      </div>
    </div>
  </div>
</main>
</body>
</html>
