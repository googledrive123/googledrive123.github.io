<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Console · GameVault preview</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400..700&display=swap" rel="stylesheet">
<style>
/* Every color comes from one hue (ember), so the theme is three numbers. */
:root{
  --h:25;--c:1;--ah:25;
  --bg:oklch(0.125 calc(0.024 * var(--c)) var(--h));
  --tx:oklch(0.97 calc(0.012 * var(--c)) var(--h));
  --mu:oklch(0.79 calc(0.035 * var(--c)) var(--h));
  --s2:oklch(0.265 calc(0.048 * var(--c)) var(--h));
  --s3:oklch(0.32 calc(0.055 * var(--c)) var(--h));
  --ln:oklch(0.92 calc(0.04 * var(--c)) var(--h) / 0.1);
  --red:oklch(0.6 0.21 var(--ah));
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;background:var(--bg);color:var(--tx);font-family:'Sora',system-ui,sans-serif}
a{color:inherit}
.screen{position:relative;height:100vh;min-height:635px;overflow:hidden;background:var(--bg)}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,oklch(0.125 calc(0.024 * var(--c)) var(--h) / 0.94) 0%,oklch(0.125 calc(0.024 * var(--c)) var(--h) / 0.6) 55%,oklch(0.125 calc(0.024 * var(--c)) var(--h) / 0.3) 100%),linear-gradient(0deg,oklch(0.125 calc(0.024 * var(--c)) var(--h) / 0.9) 0%,transparent 45%)}
.top{position:relative;display:flex;align-items:center;gap:16px;height:72px;padding:0 48px}
.mark{display:block;width:26px;height:26px}
.word{font-size:17px;font-weight:600;letter-spacing:-0.02em}
.status{margin-left:auto;display:flex;align-items:center;gap:20px;font-size:13px}
.clock{display:flex;align-items:center;gap:8px;white-space:nowrap}
.mu{color:var(--mu)}
.timer{font-weight:600;font-variant-numeric:tabular-nums}
button{padding:0;border:0;background:none;font:inherit;color:inherit;cursor:pointer}
.friends{display:flex;align-items:center;gap:10px;color:var(--mu)}
.faces{display:flex}
.face{width:26px;height:26px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:11px;font-weight:700;color:oklch(0.97 0.01 25);box-shadow:0 0 0 2px var(--bg)}
.face+.face{margin-left:-6px;background:var(--s2)}
.me{width:36px;height:36px;border-radius:50%;background:var(--s3);display:grid;place-items:center;font-size:14px;font-weight:600}
.hero{position:relative;max-width:760px;padding:40px 48px 0}
.kicker{font-size:13px;color:var(--mu)}
.hero h1{margin:10px 0 12px;font-size:52px;font-weight:700;letter-spacing:-0.04em;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line{font-size:15px;color:var(--mu)}
.acts{margin-top:24px;display:flex;gap:10px}
.cta,.star{height:44px;display:flex;align-items:center;border-radius:14px;font-size:15px;text-decoration:none;cursor:pointer}
.cta{padding:0 24px;background:var(--red);color:#fff;font-weight:600}
.cta:hover{background:oklch(0.65 0.2 var(--ah))}
.star{padding:0 20px;background:var(--ln);font-weight:500}
.star:hover{background:oklch(0.92 calc(0.04 * var(--c)) var(--h) / 0.16)}
</style>
</head>
<body>
<div class="screen">
  <div class="shade"></div>

  <header class="top">
    <img class="mark" src="/favicon.svg" alt="">
    <span class="word">gamevault</span>
    <div class="status">
      <button class="friends" type="button" data-soon><span class="faces"><span class="face">J</span><span class="face">K</span></span>2 friends online</button>
      <span class="clock"><span class="mu">period 3</span><span class="timer" id="timer">23:41</span></span>
      <button class="me" type="button" title="Profile" data-soon>M</button>
    </div>
  </header>

  <div class="hero">
    <div class="kicker" id="kicker">track of the week · ends in 2d 13:54</div>
    <h1 id="name">PolyTrack</h1>
    <div class="line" id="line">racing · summer 3 · nova leads at 1:02.418 · 312 racers</div>
    <div class="acts">
      <a class="cta" id="cta" href="#" data-soon>race now</a>
      <a class="star" href="#" data-soon>add to stars</a>
    </div>
  </div>
</div>
</body>
</html>
