<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Home base · GameVault preview</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#121110;color:#f4f1ec;font-family:'Schibsted Grotesk',system-ui,sans-serif}
a{color:inherit}
input::placeholder{color:currentColor;opacity:.5}
.hb{display:grid;grid-template-columns:240px minmax(0,1fr);background:#121110}
.side{background:#0e0d0c;border-right:1px solid rgba(255,245,235,.07)}
.side-in{height:635px;display:flex;flex-direction:column;padding:20px 14px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px;margin-bottom:24px;color:#f4f1ec;text-decoration:none;cursor:pointer}
.brand img{width:28px;height:28px;display:block}
.brand span{font-size:17px;font-weight:700;letter-spacing:-.015em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;height:36px;padding:0 10px;border-radius:10px;color:#a8a29a;text-decoration:none;font-size:14px;font-weight:500;cursor:pointer}
.nav a:not(.on):hover{background:#1b1a18;color:#f4f1ec}
.nav a.on{background:#242220;color:#f4f1ec;font-weight:600}
.nav svg{flex-shrink:0}
.main{padding:36px 40px 0;min-width:0}
.top{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:40px;align-items:end;margin-bottom:44px}
.date{margin:0 0 8px;font-size:14px;color:#a8a29a}
h1{margin:0 0 20px;font-size:36px;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.find{display:flex;gap:8px}
.search{position:relative;flex:1;display:flex;align-items:center;gap:8px;height:44px;padding:0 10px 0 42px;border-radius:10px;background:#1b1a18;border:1px solid rgba(255,245,235,.08);color:#f4f1ec}
.search svg{position:absolute;left:14px;top:13px}
.search input{flex:1;min-width:0;height:100%;background:transparent;border:0;outline:none;color:#f4f1ec;font-family:inherit;font-size:15px}
.ghost{height:44px;padding:0 18px;border-radius:10px;border:1px solid rgba(255,245,235,.12);background:transparent;color:#f4f1ec;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.ghost:hover{background:#1b1a18}
.nav-label{font-size:12px;color:#a8a29a;padding:0 10px;margin:18px 0 6px}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:#ff3b3b;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}
.clock{margin-top:auto;padding:12px;border-radius:10px;background:#1b1a18;display:flex;flex-direction:column;gap:6px}
.clock-top{display:flex;justify-content:space-between;align-items:baseline}
.clock-name{font-size:13px;font-weight:600}
.clock-ends{font-size:12px;color:#a8a29a}
.clock-time{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.15}
.clock-bar{display:block;height:4px;border-radius:2px;background:rgba(255,245,235,.1);overflow:hidden}
.clock-bar span{display:block;height:100%;background:#f4f1ec;border-radius:2px}
.me{display:flex;align-items:center;gap:10px;padding:10px 10px 0;margin-top:10px}
.me-av{width:32px;height:32px;border-radius:50%;background:#2e2b28;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.me-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.me-name{font-size:14px;font-weight:600}
.me-sub{font-size:12px;color:#a8a29a}
.me-set{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;border:0;background:transparent;color:#a8a29a;cursor:pointer;padding:0}
.me-set:hover{background:#1b1a18;color:#f4f1ec}
</style>
</head>
<body>
<div class="hb">
  <aside class="side">
    <div class="side-in">
      <a class="brand" data-soon><img src="/favicon.svg" alt=""><span>GameVault</span></a>
      <nav class="nav">
        <a class="on" data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="4"></rect><path d="M8 11v3M6.5 12.5h3"></path><circle cx="15.5" cy="12" r="1"></circle><circle cx="17.5" cy="14" r="1"></circle></svg>Games</a>
        <a data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M10 9l5 3-5 3z"></path></svg>Movies</a>
        <a data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5"></circle><circle cx="16.5" cy="16" r="2.5"></circle></svg>Music</a>
      </nav>
      <div class="nav-label">Community</div>
      <nav class="nav">
        <a data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"></path></svg>Chat<span class="badge">2</span></a>
        <a data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"></path><path d="M16 4.7a3.5 3.5 0 0 1 0 6.6M18 14c2 .8 3.5 3 3.5 6"></path></svg>Friends</a>
        <a data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"></path><rect x="5" y="11" width="4" height="9"></rect><rect x="10" y="6" width="4" height="14"></rect><rect x="15" y="14" width="4" height="6"></rect></svg>Leaderboard</a>
        <a data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h8v5a4 4 0 0 1-8 0z"></path><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M9 20h6"></path></svg>Challenge</a>
        <a data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h16l-1.5 11h-13z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>Shop</a>
        <a data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"></circle><circle cx="12" cy="5" r="2"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle></svg>More</a>
      </nav>
      <div class="clock">
        <div class="clock-top"><span class="clock-name">Period 3</span><span class="clock-ends">ends 10:30 AM</span></div>
        <span class="clock-time" id="timer">23:41</span>
        <span class="clock-bar"><span id="timerPct" style="width:52.6%"></span></span>
      </div>
      <div class="me" data-soon>
        <span class="me-av">M</span>
        <span class="me-txt"><span class="me-name">maddox</span><span class="me-sub">Level 12 · 340 coins</span></span>
        <button class="me-set" type="button" title="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <p class="date">Friday, October 2</p>
        <h1>What are we playing?</h1>
        <div class="find">
          <label class="search">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a8a29a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input id="qb" placeholder="Search 1,958 games" aria-label="Search games" autocomplete="off" spellcheck="false">
          </label>
          <button class="ghost" id="surpriseB" type="button">Surprise me</button>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
