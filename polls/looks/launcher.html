<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Launcher · GameVault preview</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400..700&display=swap" rel="stylesheet">
<style>
  :root {
    --h: 25; --c: 1; --ah: 25;
    --bg: oklch(0.155 calc(0.028 * var(--c)) var(--h));
    --tx: oklch(0.97 calc(0.012 * var(--c)) var(--h));
    --mu: oklch(0.79 calc(0.035 * var(--c)) var(--h));
    --s1: oklch(0.21 calc(0.038 * var(--c)) var(--h));
    --s1a: oklch(0.21 calc(0.038 * var(--c)) var(--h) / 0.55);
    --s2: oklch(0.265 calc(0.048 * var(--c)) var(--h));
    --s3: oklch(0.32 calc(0.055 * var(--c)) var(--h));
    --ln: oklch(0.92 calc(0.04 * var(--c)) var(--h) / 0.1);
    --ln2: oklch(0.92 calc(0.04 * var(--c)) var(--h) / 0.18);
    --red: oklch(0.6 0.21 var(--ah));
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Onest', system-ui, sans-serif; }
  a { color: inherit; }
  button { font-family: inherit; }
  input::placeholder { color: currentColor; opacity: .5; }

  .scr { position: relative; height: 100vh; min-height: 635px; overflow: hidden; background: var(--bg); }
  .glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(55% 60% at 50% 118%, oklch(0.42 calc(0.12 * var(--c)) var(--h) / 0.55), transparent 70%), radial-gradient(40% 45% at 10% -12%, oklch(0.36 calc(0.08 * var(--c)) var(--h) / 0.45), transparent 70%); }
  .launch { position: absolute; inset: 0; }

  .pill { position: absolute; top: 20px; left: 24px; display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 14px; border-radius: 12px; background: var(--s1a); border: 1px solid var(--ln); backdrop-filter: blur(18px); font-size: 13px; white-space: nowrap; }
  .pill-lbl { color: var(--mu); }
  .pill-time { font-weight: 600; font-variant-numeric: tabular-nums; }
  .pill-bar { display: block; width: 48px; height: 4px; border-radius: 2px; background: var(--ln2); overflow: hidden; }
  .pill-fill { display: block; height: 100%; background: var(--tx); }
  .corner { position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 8px; }
  .ibtn { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; border: 1px solid var(--ln); background: var(--s1a); color: var(--mu); cursor: pointer; padding: 0; }
  .ibtn:hover { color: oklch(0.97 0.01 25); }
  .avatar { width: 36px; height: 36px; border-radius: 12px; border: 0; background: var(--s3); color: var(--tx); font-size: 14px; font-weight: 600; cursor: pointer; padding: 0; }
  .col { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 116px; }
  .brand { display: flex; align-items: center; gap: 16px; margin: 0; font-weight: 600; }
  .brand img { width: 48px; height: 48px; display: block; }
  .brand span { font-size: 64px; letter-spacing: -0.045em; line-height: 1; }
  .tagline { margin: 14px 0 0; font-size: 15px; color: var(--mu); }
</style>
</head>
<body>
<main class="scr" id="scr">
  <div class="glow"></div>
  <div class="launch" id="launch">
    <div class="col">
      <h1 class="brand"><img src="/favicon.svg" alt=""><span>gamevault</span></h1>
      <p class="tagline">1,958 games. no ads.</p>
    </div>
    <div class="pill" title="Class timer">
      <span class="pill-lbl">period 3</span>
      <span class="pill-time" id="timer">23:41</span>
      <span class="pill-bar"><span class="pill-fill" id="timerBar" style="width:52.6%"></span></span>
    </div>
    <div class="corner">
      <button class="ibtn" type="button" title="Settings" aria-label="Settings" data-soon><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"></path></svg></button>
      <button class="avatar" type="button" title="Profile" data-soon>M</button>
    </div>
  </div>
</main>
</body>
</html>
