<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Start page · GameVault preview</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:#f7f7f5;color:#18181b;font-family:'Figtree',system-ui,sans-serif}
a{color:inherit}
img{display:block}
input::placeholder{color:currentColor;opacity:.5}
.hero{position:relative;height:635px;display:flex;flex-direction:column}
.top{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px}
.clock{display:flex;align-items:center;gap:10px;font-size:14px}
.clock-name{font-weight:600}
.clock-left{color:#64646b;font-variant-numeric:tabular-nums}
.nav{display:flex;align-items:center;gap:4px}
.nav-link{height:36px;padding:0 12px;display:flex;align-items:center;border-radius:999px;font-size:14px;color:#3f3f46;text-decoration:none;cursor:pointer}
.nav-link:hover,.icon-btn:hover{background:#ecebe8}
.icon-btn{position:relative;width:36px;height:36px;display:grid;place-items:center;border-radius:50%;border:0;background:transparent;color:#3f3f46;cursor:pointer;padding:0}
.icon-btn.chat{margin-left:4px}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#e0262f;box-shadow:0 0 0 2px #f7f7f5}
.avatar{width:32px;height:32px;margin-left:6px;border-radius:50%;border:0;background:#18181b;color:#fff;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;padding:0}
</style>
</head>
<body>
<div class="hero">
  <header class="top">
    <div class="clock" title="Class timer">
      <svg width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="7" fill="none" stroke="#e5e4e0" stroke-width="2.5"></circle><circle id="ring" cx="9" cy="9" r="7" fill="none" stroke="#18181b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="23.15 43.98" transform="rotate(-90 9 9)"></circle></svg>
      <span class="clock-name">Period 3</span>
      <span class="clock-left"><span id="timer">23:41</span> left</span>
    </div>
    <nav class="nav">
      <a class="nav-link" data-soon>Movies</a>
      <a class="nav-link" data-soon>Music</a>
      <a class="nav-link" data-soon>Leaderboard</a>
      <button class="icon-btn chat" type="button" title="Chat" data-soon>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"></path></svg>
        <span class="dot"></span>
      </button>
      <button class="icon-btn" type="button" title="Apps" data-soon>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="2"></circle><circle cx="12" cy="5" r="2"></circle><circle cx="19" cy="5" r="2"></circle><circle cx="5" cy="12" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="19" cy="12" r="2"></circle><circle cx="5" cy="19" r="2"></circle><circle cx="12" cy="19" r="2"></circle><circle cx="19" cy="19" r="2"></circle></svg>
      </button>
      <button class="avatar" type="button" title="Profile" data-soon>M</button>
    </nav>
  </header>
</div>
</body>
</html>
