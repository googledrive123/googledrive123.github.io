<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Widgets · GameVault preview</title>
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&display=swap" rel="stylesheet">
<style>
  /* Ember theme: every color comes from one hue. */
  :root {
    --h: 25; --c: 1; --ah: 25;
    --bg: oklch(0.155 calc(0.028 * var(--c)) var(--h));
    --s2: oklch(0.21 calc(0.038 * var(--c)) var(--h));
    --s3: oklch(0.265 calc(0.048 * var(--c)) var(--h));
    --s4: oklch(0.32 calc(0.055 * var(--c)) var(--h));
    --tx: oklch(0.97 calc(0.012 * var(--c)) var(--h));
    --mu: oklch(0.79 calc(0.035 * var(--c)) var(--h));
    --red: oklch(0.6 0.21 var(--ah));
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font-family: 'Manrope', system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  .screen { position: relative; height: 100vh; min-height: 635px; overflow: hidden; display: flex; flex-direction: column; }

  .top { flex-shrink: 0; height: 68px; display: flex; align-items: center; gap: 28px; padding: 0 32px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand img { width: 26px; height: 26px; display: block; }
  .brand span { font-size: 17px; font-weight: 700; letter-spacing: -0.02em; }
  .tabs { display: flex; gap: 4px; font-size: 14px; font-weight: 600; }
  .tab { height: 36px; padding: 0 14px; display: flex; align-items: center; border-radius: 12px; color: var(--mu); cursor: pointer; }
  .tab:hover { background: var(--s2); }
  .tab.on { background: var(--s3); color: inherit; }

  .tools { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .search { display: flex; align-items: center; gap: 10px; width: 320px; height: 36px; padding: 0 12px; border-radius: 12px; background: var(--s2); }
  .search svg { flex-shrink: 0; opacity: .7; }
  .search input { flex: 1; min-width: 0; height: 100%; border: 0; outline: none; background: transparent; color: inherit; font-family: inherit; font-size: 14px; }
  .search input::placeholder { color: currentColor; opacity: .5; }
  .icon-btn { position: relative; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 12px; border: 0; background: var(--s2); color: inherit; cursor: pointer; padding: 0; }
  .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--red); }
  .avatar { width: 36px; height: 36px; border-radius: 12px; background: var(--s4); display: grid; place-items: center; font-size: 14px; font-weight: 700; }

  .cards { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: minmax(0, 1.25fr) minmax(0, 1fr); gap: 14px; padding: 2px 32px 28px; }
  .card { border-radius: 22px; background: var(--s2); }
  .kicker { font-size: 13px; color: var(--mu); }
  .btn-red { display: flex; align-items: center; border-radius: 12px; background: var(--red); color: #fff; font-size: 14px; font-weight: 700; }

  .jump { grid-column: span 2; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); overflow: hidden; cursor: pointer; }
  .jump-art { position: relative; display: block; min-height: 0; }
  .jump-art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .jump-body { display: flex; flex-direction: column; padding: 22px; min-width: 0; }
  .jump-name { margin-top: 6px; font-size: 30px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
  .jump-meta { margin-top: 4px; font-size: 13px; color: var(--mu); }
  .jump-play { margin-top: 16px; align-self: flex-start; height: 40px; padding: 0 20px; }
</style>
</head>
<body>
<div class="screen">
  <header class="top">
    <span class="brand"><img src="/favicon.svg" alt=""><span>gamevault</span></span>
    <nav class="tabs">
      <a class="tab on">home</a>
      <a class="tab" data-soon>games</a>
      <a class="tab" data-soon>movies</a>
      <a class="tab" data-soon>music</a>
      <a class="tab" data-soon>leaderboard</a>
      <a class="tab" data-soon>more</a>
    </nav>
    <div class="tools">
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="q2c" type="text" placeholder="search 1,958 games" autocomplete="off" aria-label="Search games">
      </label>
      <button class="icon-btn" type="button" title="Chat" data-soon><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v10H9l-5 4z"></path></svg><span class="dot"></span></button>
      <span class="avatar" title="Profile" data-soon>M</span>
    </div>
  </header>

  <main class="cards">
    <a class="card jump" data-soon>
      <span class="jump-art"><img src="/thumbs/slope2.webp" alt=""></span>
      <span class="jump-body">
        <span class="kicker">jump back in</span>
        <span class="jump-name">Slope 2</span>
        <span class="jump-meta">12 min ago · action</span>
        <span class="btn-red jump-play">play</span>
      </span>
    </a>
  </main>
</div>
</body>
</html>
