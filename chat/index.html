<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat · GameVault</title>
  <meta name="description" content="One chat room for everyone signed in to GameVault.">
  <link rel="icon" href="/favicon.svg">
  <!-- Blocking on purpose: the cloak has to land before the first paint. -->
  <script src="/js/mimicry.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
  <script src="/js/identity.js" defer></script>
  <script src="/js/analytics.js" defer></script>
  <script src="/js/site.js" defer></script>
  <script src="/js/player.js" defer></script>
  <script src="/js/avatars.js" defer></script>
  <script src="/js/social.js" defer></script>
  <script src="/js/chat.js" defer></script>
</head>
<body>
<main class="page">
  <div class="page-kicker">chat</div>
  <h1>Chat</h1>
  <p class="lede">One room for everyone with a GameVault account.</p>

  <div id="chat"></div>

<script>
// The same chat as the home page's chat button (js/chat.js), held in this
// page's layout.
(function () {
  'use strict';

  var SUPA_URL = 'https://dxwjxzmlezfyursysays.supabase.co';
  var SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4d2p4em1sZXpmeXVyc3lzYXlzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg3MTM1MzAsImV4cCI6MjA5NDI4OTUzMH0.BQZdvlRD1ykfSV0bhlxt77Nb90DzvcX4NI2LrMK4n_0';
  // Where supabase-js keeps the session the home page signed in with.
  var TOKEN_KEY = 'sb-dxwjxzmlezfyursysays-auth-token';

  var box = document.getElementById('chat');

  function savedSession() {
    try {
      var s = JSON.parse(localStorage.getItem(TOKEN_KEY) || 'null');
      return s && s.access_token ? s : null;
    } catch (e) { return null; }
  }

  function show(user, sb) {
    if (user) GV.social.start(sb, user, {});
    else GV.social.stop();
    GV.chat.open({ into: box });
  }

  // Signing in on the home page in another tab opens chat here too.
  window.addEventListener('storage', function (e) {
    if (e.key === TOKEN_KEY && e.newValue && !(GV.social && GV.social.user())) location.reload();
  });

  document.addEventListener('DOMContentLoaded', function () {
    if (!window.GV || !GV.chat || !GV.social) return;
    // No session at all needs no network to know, so guests see the sign-in
    // note straight away.
    if (!savedSession() || !window.supabase) return show(null);
    // Restores the home page's session and refreshes it when it runs out.
    var sb = window.supabase.createClient(SUPA_URL, SUPA_KEY);
    sb.auth.onAuthStateChange(function (event, session) {
      if (event === 'INITIAL_SESSION') return;
      show(session ? session.user : null, sb);
    });
    sb.auth.getSession().then(function (r) {
      var session = r.data.session;
      show(session ? session.user : null, sb);
    });
  });
})();
</script>
</main>
</body>
</html>
