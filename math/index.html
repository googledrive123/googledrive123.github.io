<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Math practice · GameVault</title>
  <meta name="description" content="Endless math questions from arithmetic to calculus, with points, streaks and a worked answer for every one.">
  <link rel="icon" href="/favicon.svg">
  <!-- Blocking on purpose: the cloak has to land before the first paint. -->
  <script src="/js/mimicry.js"></script>
  <script src="/js/urlcloak.js"></script>
  <script src="/js/pwa.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/identity.js" defer></script>
  <script src="/js/analytics.js" defer></script>
  <script src="/js/site.js" defer></script>
  <script src="/js/player.js" defer></script>
  <style>
    .page { --good: #5ce08a; }
    /* site.css gives .btn and friends a display, which would beat [hidden]. */
    .page [hidden] { display: none !important; }

    /* Score tiles */
    .scorebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin-top: 1.5rem; }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.85rem 1rem;
      transition: border-color 0.2s;
    }
    .stat-num {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.45rem; font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .stat-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--muted-2);
      margin-top: 0.2rem;
    }
    .stat .boost { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--accent); margin-left: 0.4rem; }
    .stat.hot { border-color: rgba(255,59,59,0.45); }
    .bump { animation: bump 0.35s ease; }
    @keyframes bump { 40% { transform: scale(1.12); } }

    /* Subject and level pickers */
    .subjects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
    .subject {
      display: grid; grid-template-columns: auto 1fr; column-gap: 0.75rem; row-gap: 0.15rem;
      align-items: center;
      padding: 0.7rem 0.8rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      font: inherit; text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }
    .subject:hover { border-color: var(--border-strong); background: rgba(255,255,255,0.03); }
    .subject .glyph {
      grid-row: span 3;
      display: grid; place-items: center;
      width: 40px; height: 40px;
      border-radius: 10px;
      background: var(--surface-2);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: 0.9rem; font-weight: 600;
      transition: all 0.15s;
    }
    .subject .name { color: var(--text); font-size: 0.88rem; font-weight: 500; line-height: 1.25; }
    .subject .rec { font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--muted-2); }
    .subject .meter { display: block; height: 3px; border-radius: 3px; background: var(--surface-2); overflow: hidden; margin-top: 0.2rem; }
    .subject .meter span { display: block; height: 100%; width: 0; background: var(--good); transition: width 0.3s; }
    .subject.active { border-color: var(--accent); background: rgba(255,59,59,0.07); }
    .subject.active .glyph { background: var(--accent); color: #fff; }

    .levels {
      display: inline-flex; gap: 0.25rem;
      padding: 0.25rem;
      border: 1px solid var(--border);
      border-radius: 100px;
      background: var(--bg);
    }
    .level {
      border: 0; border-radius: 100px;
      background: transparent;
      color: var(--muted);
      font: inherit; font-size: 0.84rem;
      padding: 0.45rem 1rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .level:hover { color: var(--text); }
    .level .pts { font-family: 'JetBrains Mono', monospace; font-size: 0.64rem; color: var(--muted-2); margin-left: 0.45rem; }
    .level.active { background: var(--surface-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-strong); }
    .level.active .pts { color: var(--accent); }

    /* Question card */
    .quiz { padding: 1.5rem; transition: border-color 0.2s; }
    .quiz:focus { outline: none; }
    .quiz.is-right { border-color: rgba(92,224,138,0.35); }
    .quiz.is-wrong { border-color: rgba(255,59,59,0.35); }
    .quiz-head { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.6rem; }
    .quiz-head .panel-label { margin: 0; }
    .quiz-count { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--muted-2); }
    .worth {
      font-family: 'JetBrains Mono', monospace; font-size: 0.66rem;
      color: var(--accent);
      border: 1px solid rgba(255,59,59,0.4);
      border-radius: 100px;
      padding: 0.1rem 0.45rem;
    }
    .page .ask { margin-top: 1.1rem; color: var(--muted); font-size: 0.95rem; }
    .page .ask.big { color: var(--text); font-size: 1.15rem; line-height: 1.55; max-width: 60ch; margin-bottom: 1.2rem; }

    .expr {
      margin: 0.8rem 0 1.4rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(1.35rem, 4.2vw, 2rem);
      line-height: 1.6;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .expr:empty { display: none; }
    .expr > div + div { margin-top: 0.1rem; }
    .frac {
      display: inline-flex; flex-direction: column;
      vertical-align: middle;
      text-align: center;
      font-size: 0.78em; line-height: 1.15;
      margin: 0 0.12em;
    }
    .frac > span { padding: 0 0.18em; }
    .frac > span:first-child { border-bottom: 0.08em solid currentColor; padding-bottom: 0.08em; }
    .frac > span:last-child { padding-top: 0.08em; }
    .gap { display: inline-block; width: 0.2em; }
    .quiz sup { font-size: 0.6em; line-height: 0; }
    .quiz sub { font-size: 0.6em; line-height: 0; }
    .rad { border-top: 0.07em solid currentColor; padding: 0.05em 0.1em 0; margin-left: 0.02em; }
    .lim { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.1; }
    .lim > span { font-size: 0.5em; color: var(--muted); }
    .int { display: inline-flex; align-items: center; vertical-align: middle; margin-right: 0.25em; }
    .int .sign { font-size: 1.5em; line-height: 1; }
    .int .ends { display: inline-flex; flex-direction: column; justify-content: space-between; gap: 0.9em; font-size: 0.5em; line-height: 1; color: var(--muted); }
    .hl { color: var(--accent); text-decoration: underline; text-underline-offset: 0.18em; }
    .box {
      display: inline-block; vertical-align: middle;
      width: 1.3em; height: 1.1em;
      border: 0.07em dashed var(--muted); border-radius: 0.15em;
    }
    .vals { border-collapse: collapse; font-size: 0.6em; }
    .vals th, .vals td { border: 1px solid var(--border-strong); padding: 0.35em 0.9em; text-align: center; font-weight: 500; }
    .vals th { color: var(--muted); background: var(--surface-2); }
    .fig { display: block; width: 100%; max-width: 280px; height: auto; color: var(--muted); }
    .fig text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: var(--muted); }
    .fig text.len { fill: var(--text); font-weight: 600; }

    /* Typed answers */
    .answer { display: flex; gap: 0.5rem; max-width: 480px; }
    .answer-box {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 0.35rem;
      padding: 0 0.9rem;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      background: var(--bg);
      transition: border-color 0.15s;
    }
    .answer-box:focus-within { border-color: var(--muted); }
    .answer-box.right { border-color: var(--good); }
    .answer-box.wrong { border-color: var(--accent); }
    .answer-box .field {
      border: 0; border-radius: 0; background: transparent;
      padding: 0.75rem 0;
      font-family: 'JetBrains Mono', monospace; font-size: 1.1rem;
    }
    .adorn { font-family: 'JetBrains Mono', monospace; font-size: 1.05rem; color: var(--muted); }
    .adorn:empty { display: none; }
    .answer .btn { padding: 0 1.3rem; }
    .answer-box.bump { animation: nudge 0.3s ease; }
    @keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

    /* Multiple choice */
    .choices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
    .choice {
      display: flex; align-items: center; gap: 0.8rem;
      min-height: 58px;
      padding: 0.7rem 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace; font-size: 1.02rem;
      text-align: left;
      cursor: pointer;
      transition: all 0.15s;
    }
    .choice:hover:not(:disabled) { border-color: var(--border-strong); background: var(--surface-2); }
    .choice:disabled { cursor: default; }
    .choice .key {
      flex-shrink: 0;
      display: grid; place-items: center;
      width: 1.6rem; height: 1.6rem;
      border-radius: 7px;
      border: 1px solid var(--border-strong);
      font-size: 0.7rem; color: var(--muted);
    }
    .choice .body { line-height: 1.5; }
    .choice .frac { font-size: 0.9em; }
    .choice.right { border-color: var(--good); background: rgba(92,224,138,0.08); }
    .choice.right .key { border-color: var(--good); color: var(--good); }
    .choice.wrong { border-color: var(--accent); background: rgba(255,59,59,0.08); }
    .choice.wrong .key { border-color: var(--accent); color: var(--accent); }
    .choice.dim { opacity: 0.4; }

    .page .hint { font-size: 0.8rem; color: #f0c04a; margin-top: 0.6rem; }
    .page .hint:empty { display: none; }
  </style>
</head>
<body>
<main class="page">
  <div class="page-kicker">math</div>
  <h1>Math practice</h1>
  <p class="lede">Pick a subject and a level. Every question is made up on the spot, so there is always another one,
  and every answer comes with the working.</p>

  <div class="scorebar">
    <div class="stat"><div class="stat-num" id="statPoints">0</div><div class="stat-label">Points</div></div>
    <div class="stat" id="streakTile"><div class="stat-num" id="statStreak">0</div><span class="boost" id="statBoost"></span><div class="stat-label">Streak</div></div>
    <div class="stat"><div class="stat-num" id="statBest">0</div><div class="stat-label">Best streak</div></div>
    <div class="stat"><div class="stat-num" id="statRight">–</div><div class="stat-label">Right</div></div>
  </div>

  <div class="panel">
    <div class="panel-label">Subject</div>
    <div class="subjects" id="subjects"></div>
    <div class="panel-label" style="margin-top:1.1rem">Difficulty</div>
    <div class="levels" id="levels"></div>
  </div>

  <section class="panel quiz" id="quiz" tabindex="-1" aria-label="Question">
    <div class="quiz-head">
      <span class="panel-label" id="quizLabel">Loading</span>
      <span class="worth" id="quizWorth"></span>
      <span class="quiz-count" id="quizCount"></span>
    </div>
    <p class="ask" id="ask"></p>
    <div class="expr" id="expr"></div>
    <form class="answer" id="answerForm" autocomplete="off">
      <div class="answer-box" id="answerBox">
        <span class="adorn" id="prefix"></span>
        <input class="field" id="answer" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false"
          placeholder="Your answer" aria-label="Your answer">
        <span class="adorn" id="suffix"></span>
      </div>
      <button class="btn btn-primary" type="submit">Check</button>
    </form>
    <div class="choices" id="choices" hidden></div>
    <p class="hint" id="hint" role="status"></p>
  </section>
</main>
</body>
</html>
