<!DOCTYPE html>
<html lang="en">
<head>
    <base href="https://raw.githubusercontent.com/bubbls/youtube-playables/main/maze-speedrun/">
    <title>Maze Speedrun</title>
    <meta charset="utf-8">
    <meta name="robots" content="noindex,nofollow">
    <meta http-equiv="X-UA-Compatible" content="chrome=1, IE=9">    
    <meta name="format-detection" content="telephone=no">
    <meta name="HandheldFriendly" content="true" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Maze">
    <meta name="viewport" content="initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, width=device-width, minimal-ui" />
    
    <style>

        * { -webkit-tap-highlight-color:rgba(0,0,0,0); }

        body {
            -moz-user-select: none;
            -webkit-user-select: none;
            -ms-user-select: none;
            -khtml-user-select: none;
            margin: 0px 0px 1px 0px; /* the extra 1px allows the iOS inner/outer check to work */
            background: rgb(50, 50, 50) url(assets/tile_bg.jpg); 
            background-repeat: repeat;
        }

        #content {
            margin: 0 auto;
            position: absolute;
            width: 100%;
            height: 100%;
        }

        @font-face {
            font-family: "Sarpanch-Black";
            font-style: regular;
            src: url("assets/fonts/Sarpanch-Black.ttf");
        }  
        
        @font-face {
            font-family: "Montserrat-LightItalic";
            font-style: regular;
            src: url("assets/fonts/Montserrat-LightItalic.ttf");
        }  

    #sidebarad1,
#sidebarad2 {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 160px;
  height: 600px;
  padding: 0;
  margin: 0;
  z-index: 999999;
}
#sidebarad1 {
  left: 0;
}
#sidebarad2 {
  right: 0;
}
.sidebar-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}
.sidebar-frame {
  width: 160px;
  height: 600px;
  border: none;
  display: block;
}
</style>

<script src="https://raw.githubusercontent.com/bubbls/youtube-playables/main/ytgame.js" nonce="qnyM8EoxdJrl9n1btW3lCA"></script>
<script src="dist/bundle.js" nonce="qnyM8EoxdJrl9n1btW3lCA"></script>

</head>
<body>
    
<div id="content"></div>

<div id="sidebarad1">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
<div id="sidebarad2">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
</body>
</html>
