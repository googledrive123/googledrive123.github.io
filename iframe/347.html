<!DOCTYPE html>
<html lang="en-us">
  <head>
    <base href="https://cdn.jsdelivr.net/gh/freebuisness/assets@main/347/">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity WebGL Player | SpiderDoll</title>
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="stylesheet" href="finnalstyle.css">
    <script src="https://cdn.jsdelivr.net/gh/freebuisness/assets@main/merge.js"></script>
<script>const RAW_BASE='https://raw.githubusercontent.com/freebuisness/assets/main/347/';window.getParts=function(f,s,e){let p=[];for(let i=s;i<=e;i++)p.push(RAW_BASE+f+'.part'+i);return p;};</script>
  <body>
    <div id="loading-text" style="color: white; font-size: 48px; font-family: cursive; text-align: center; margin-top: 20px;">LOADING...</div>
    <div id="unity-container" class="unity-desktop" hidden>
      <canvas id="unity-canvas"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
    </div>
    <script>
      Promise.all([
          window.mergeFiles(window.getParts("Build.data", 1, 2)),
          window.mergeFiles(window.getParts("Build.wasm", 1, 2)),
      ]).then(([wasmUrl, dataUrl]) => {
        var buildUrl = "Build";
        var loaderUrl ="Build.loader.js";
        var config = {
          dataUrl:"Build.data",
          frameworkUrl:"Build.framework.js",
          codeUrl:"Build.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "SpiderDoll",
          productVersion: "1.0",
        };

        var container = document.querySelector("#unity-container");
        container.removeAttribute("hidden");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          container.className = "unity-mobile";
          config.devicePixelRatio = 1;
        } else {
          canvas.style.width = "960px";
          canvas.style.height = "640px";
        }
        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          }).then((unityInstance) => {
            loadingBar.style.display = "none";
          }).catch((message) => {
            alert(message);
          });
      };
      document.body.appendChild(script);
      });
    </script>
  <div id="sidebarad1">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
<div id="sidebarad2">
  <div class="sidebar-close" onclick="this.parentElement.style.display='none'">✕</div>
</div>
</body>
</html>
<style>
#sidebarad1,
#sidebarad2 {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  width: 160px;
  height: 600px;
  padding: 0;
  margin: 0;
  z-index: 999999;
}
#sidebarad1 {
  left: 0;
}
#sidebarad2 {
  right: 0;
}
.sidebar-close {
  position: absolute;
  top: 0;
  right: 0;
  width: 22px;
  height: 22px;
  line-height: 22px;
  text-align: center;
  background: rgba(0,0,0,0.7);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
  user-select: none;
  z-index: 10;
}
.sidebar-frame {
  width: 160px;
  height: 600px;
  border: none;
  display: block;
}
</style>
