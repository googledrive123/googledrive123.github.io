<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music · GameVault</title>
  <meta name="description" content="Search, browse and play music while you game — tracks from Audius and live radio.">
  <link rel="icon" href="/favicon.svg">
  <!-- Blocking on purpose: the cloak has to land before the first paint. -->
  <script src="/js/mimicry.js"></script>
  <script src="/js/urlcloak.js"></script>
  <script src="/js/pwa.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/site.css">
  <script src="/js/identity.js" defer></script>
  <script src="/js/analytics.js" defer></script>
  <script src="/js/site.js" defer></script>
  <script src="/js/player.js" defer></script>
  <style>
    .search-row { display: flex; gap: 0.5rem; margin-top: 0.4rem; }
    .tabs { display: flex; gap: 0.4rem; flex-wrap: wrap; margin: 1.4rem 0 0.2rem; }
    .tab {
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      border-radius: 999px; padding: 0.42rem 0.95rem; font: inherit; font-size: 0.8rem;
      cursor: pointer; transition: all 0.15s;
    }
    .tab:hover { border-color: var(--border-strong); color: var(--text); }
    .tab.active { border-color: var(--accent); background: rgba(255,59,59,0.08); color: var(--accent); }
    .chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.9rem; }
    .chip {
      border: 1px solid var(--border); background: transparent; color: var(--muted);
      border-radius: 8px; padding: 0.32rem 0.7rem; font: inherit; font-size: 0.75rem; cursor: pointer;
    }
    .chip:hover { border-color: var(--border-strong); color: var(--text); }
    .chip.active { border-color: var(--accent); color: var(--accent); }

    .grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 0.85rem; margin-top: 1.1rem;
    }
    .card {
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface);
      overflow: hidden; cursor: pointer; transition: border-color 0.15s, transform 0.15s;
      display: flex; flex-direction: column;
    }
    .card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
    .card.playing { border-color: var(--accent); }
    .cover { position: relative; aspect-ratio: 1; background: var(--surface-2); }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .cover .fallback {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'JetBrains Mono', monospace; font-size: 1.6rem; color: var(--muted-2);
    }
    .badge {
      position: absolute; left: 0.5rem; top: 0.5rem; border-radius: 6px;
      background: rgba(0,0,0,0.65); padding: 0.1rem 0.4rem;
      font-family: 'JetBrains Mono', monospace; font-size: 0.62rem; letter-spacing: 0.06em;
    }
    .badge.live { color: #ff6b6b; }
    .add {
      position: absolute; right: 0.5rem; bottom: 0.5rem; width: 28px; height: 28px;
      border-radius: 50%; border: 0; background: rgba(0,0,0,0.65); color: #fff;
      font-size: 1rem; line-height: 1; cursor: pointer; opacity: 0; transition: opacity 0.15s;
    }
    .card:hover .add { opacity: 1; }
    .add:hover { background: var(--accent); }
    .card-body { padding: 0.55rem 0.65rem 0.7rem; }
    .card-title { font-size: 0.82rem; font-weight: 600; line-height: 1.25;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .card-sub { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .queue-row {
      display: flex; align-items: center; gap: 0.7rem; padding: 0.55rem 0;
      border-bottom: 1px solid var(--border);
    }
    .queue-row:last-child { border-bottom: 0; }
    .queue-row img { width: 38px; height: 38px; border-radius: 7px; object-fit: cover; background: var(--surface-2); }
    .queue-row .who { flex: 1; min-width: 0; }
    .queue-row .who div:first-child { font-size: 0.83rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .queue-row .who div:last-child { font-size: 0.72rem; color: var(--muted); }
    .queue-row.now .who div:first-child { color: var(--accent); }
    .icon-btn { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 1rem; padding: 0.2rem 0.4rem; }
    .icon-btn:hover { color: var(--text); }

    .status { color: var(--muted); font-size: 0.82rem; margin-top: 1.1rem; }
    .section-label {
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--muted-2); margin-top: 1.6rem;
    }
  </style>
</head>
<body>
<main class="page">
  <div class="page-kicker">music</div>
  <h1>Music</h1>
  <p class="lede">Real tracks from Audius and live radio, straight in the tab. Nothing to sign into,
  and it keeps playing while you game.</p>

  <div class="panel">
    <div class="panel-label">Search</div>
    <div class="search-row">
      <input class="field" id="q" placeholder="Songs, artists, stations…" autocomplete="off" spellcheck="false">
      <button class="btn btn-primary" id="go" type="button">Search</button>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-view="trending" type="button">Trending</button>
      <button class="tab" data-view="genres" type="button">Genres</button>
      <button class="tab" data-view="radio" type="button">Radio</button>
      <button class="tab" data-view="queue" type="button">Queue</button>
    </div>

    <div class="chips" id="chips" hidden></div>
    <div class="status" id="status"></div>
    <div class="grid" id="grid"></div>
    <div id="queue" hidden></div>
  </div>
</main>

<script>
(function () {
  'use strict';

  /* Both catalogues are public, key-free and CORS-open. Audius gives real
     tracks with seeking; radio-browser gives live streams. Neither needs a
     server of ours, and neither needs an account. */
  var AUDIUS = 'https://api.audius.co';
  var APP = 'gamevault';
  var BROWSER = 'https://de1.api.radio-browser.info/json';

  var TAGS = [
    'lofi', 'chillout', 'jazz', 'electronic', 'house', 'hip hop', 'rock', 'pop',
    'classical', 'ambient', 'anime', 'dance', 'metal', 'indie', 'oldies', 'reggae'
  ];

  var GENRES = [
    'Lo-Fi', 'Hip-Hop/Rap', 'Electronic', 'House', 'Techno', 'Drum & Bass', 'Dubstep',
    'Trap', 'Ambient', 'Rock', 'Pop', 'R&B/Soul', 'Jazz', 'Metal', 'Alternative',
    'Downtempo', 'Future Bass', 'Hyperpop', 'Soundtrack', 'Acoustic'
  ];

  var grid = document.getElementById('grid');
  var queueWrap = document.getElementById('queue');
  var statusEl = document.getElementById('status');
  var chips = document.getElementById('chips');
  var input = document.getElementById('q');
  var view = 'trending';
  var genre = 'Lo-Fi';
  var tag = '';
  var shown = [];          // the tracks currently on screen, in order

  function say(text) { statusEl.textContent = text || ''; }

  function json(url) {
    return fetch(url, { headers: { 'Accept': 'application/json' } }).then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    });
  }

  // ── Audius ──────────────────────────────────────────────────────────────

  function audiusTrack(t) {
    var art = t.artwork || {};
    return {
      id: 'audius:' + t.id,
      kind: 'audius',
      title: t.title,
      artist: (t.user && t.user.name) || 'Unknown',
      art: art['480x480'] || art['150x150'] || '',
      src: AUDIUS + '/v1/tracks/' + t.id + '/stream?app_name=' + APP,
      dur: t.duration || 0
    };
  }

  /* Gated and deleted uploads still come back from the API; they just fail to
     play, so drop them before they reach the queue. */
  function playable(t) {
    if (!t || t.is_delete || t.is_available === false) return false;
    if (t.access && t.access.stream === false) return false;
    return !!t.id && !!t.title;
  }

  function trending(g) {
    var url = AUDIUS + '/v1/tracks/trending?app_name=' + APP + '&limit=40'
      + (g ? '&genre=' + encodeURIComponent(g) : '');
    return json(url).then(function (r) { return (r.data || []).filter(playable).map(audiusTrack); });
  }

  function searchTracks(q) {
    return json(AUDIUS + '/v1/tracks/search?app_name=' + APP + '&limit=40&query=' + encodeURIComponent(q))
      .then(function (r) { return (r.data || []).filter(playable).map(audiusTrack); });
  }

  // ── Radio ───────────────────────────────────────────────────────────────

  function browserStations(query, tag) {
    var url = query
      ? BROWSER + '/stations/search?limit=60&hidebroken=true&order=clickcount&reverse=true&name='
        + encodeURIComponent(query)
      : tag
        ? BROWSER + '/stations/bytag/' + encodeURIComponent(tag)
          + '?limit=60&hidebroken=true&order=clickcount&reverse=true'
        : BROWSER + '/stations/topclick/80?hidebroken=true';
    return json(url).then(function (list) {
      return (list || []).filter(function (s) {
        // Mixed content is blocked on an https page, so http-only stations
        // would fail silently. Drop them here instead.
        return s.url_resolved && s.url_resolved.indexOf('https://') === 0 && s.lastcheckok !== 0;
      }).map(function (s) {
        return {
          id: 'rb:' + s.stationuuid,
          kind: 'radio',
          title: s.name.trim(),
          artist: [s.country, s.tags.split(',')[0]].filter(Boolean).join(' · ') || 'Radio',
          art: s.favicon || '',
          src: s.url_resolved
        };
      });
    });
  }

  // ── Painting ────────────────────────────────────────────────────────────

  function clock(sec) {
    var m = Math.floor(sec / 60), s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' : '') + s;
  }

  function cardFor(track, index) {
    var card = document.createElement('div');
    card.className = 'card';
    card.dataset.index = index;

    var cover = document.createElement('div');
    cover.className = 'cover';
    if (track.art) {
      var img = document.createElement('img');
      img.src = track.art;
      img.alt = '';
      img.loading = 'lazy';
      img.onerror = function () { img.remove(); };
      cover.appendChild(img);
    } else {
      var fb = document.createElement('div');
      fb.className = 'fallback';
      fb.textContent = (track.title || '?').charAt(0).toUpperCase();
      cover.appendChild(fb);
    }

    var badge = document.createElement('span');
    badge.className = 'badge' + (track.kind === 'radio' ? ' live' : '');
    badge.textContent = track.kind === 'radio' ? '● LIVE' : clock(track.dur || 0);
    cover.appendChild(badge);

    var add = document.createElement('button');
    add.className = 'add';
    add.type = 'button';
    add.textContent = '+';
    add.title = 'Add to queue';
    add.addEventListener('click', function (e) {
      e.stopPropagation();
      queueUp(track);
    });
    cover.appendChild(add);

    var body = document.createElement('div');
    body.className = 'card-body';
    var t = document.createElement('div');
    t.className = 'card-title';
    t.textContent = track.title;
    var s = document.createElement('div');
    s.className = 'card-sub';
    s.textContent = track.artist;
    body.append(t, s);

    card.append(cover, body);
    card.addEventListener('click', function () { playFrom(index); });
    return card;
  }

  function paint(list) {
    shown = list;
    grid.innerHTML = '';
    if (!list.length) { say('Nothing came back. Try another search.'); return; }
    say('');
    var frag = document.createDocumentFragment();
    list.forEach(function (track, i) { frag.appendChild(cardFor(track, i)); });
    grid.appendChild(frag);
    markPlaying();
  }

  function markPlaying() {
    var now = window.GV.player.state().track;
    grid.querySelectorAll('.card').forEach(function (c) {
      var t = shown[c.dataset.index];
      c.classList.toggle('playing', !!(now && t && now.id === t.id));
    });
  }

  // ── Playing ─────────────────────────────────────────────────────────────

  function playFrom(index) {
    if (!shown[index]) return;
    window.GV.player.play(shown, index);
  }

  function queueUp(track) {
    window.GV.player.enqueue(track, false);
  }

  // ── Views ───────────────────────────────────────────────────────────────

  function paintQueue() {
    var s = window.GV.player.state();
    queueWrap.innerHTML = '';
    if (!s.queue.length) {
      queueWrap.innerHTML = '<div class="status">Queue is empty. Play something and it shows up here.</div>';
      return;
    }
    s.queue.forEach(function (track, i) {
      var row = document.createElement('div');
      row.className = 'queue-row' + (i === s.index ? ' now' : '');
      var img = document.createElement('img');
      if (track.art) img.src = track.art;
      img.alt = '';
      var who = document.createElement('div');
      who.className = 'who';
      who.innerHTML = '<div></div><div></div>';
      who.children[0].textContent = track.title;
      who.children[1].textContent = track.artist;
      var playBtn = document.createElement('button');
      playBtn.className = 'icon-btn';
      playBtn.type = 'button';
      playBtn.textContent = i === s.index && s.playing ? '❚❚' : '▶';
      playBtn.addEventListener('click', function () {
        if (i === s.index) window.GV.player.toggle();
        else window.GV.player.play(null, i);
      });
      var del = document.createElement('button');
      del.className = 'icon-btn';
      del.type = 'button';
      del.textContent = '✕';
      del.title = 'Remove';
      del.addEventListener('click', function () { window.GV.player.removeAt(i); paintQueue(); });
      row.append(img, who, playBtn, del);
      queueWrap.appendChild(row);
    });
    var clear = document.createElement('button');
    clear.className = 'btn';
    clear.type = 'button';
    clear.textContent = 'Clear queue';
    clear.style.marginTop = '1rem';
    clear.addEventListener('click', function () { window.GV.player.clear(); paintQueue(); });
    queueWrap.appendChild(clear);
  }

  /* Genre chips for Audius, tag chips for radio — same row, same behaviour. */
  function paintChips() {
    var radio = view === 'radio';
    var items = radio ? TAGS : GENRES;
    var active = radio ? tag : genre;
    chips.innerHTML = '';
    items.forEach(function (name) {
      var b = document.createElement('button');
      b.className = 'chip' + (name === active ? ' active' : '');
      b.type = 'button';
      b.textContent = name;
      b.addEventListener('click', function () {
        if (radio) tag = tag === name ? '' : name;
        else genre = name;
        paintChips();
        load();
      });
      chips.appendChild(b);
    });
  }

  function load() {
    grid.hidden = view === 'queue';
    queueWrap.hidden = view !== 'queue';
    chips.hidden = view !== 'genres' && view !== 'radio';

    if (view === 'queue') { paintQueue(); say(''); return; }
    if (view === 'genres' || view === 'radio') paintChips();

    say('Loading…');
    grid.innerHTML = '';

    if (view === 'trending') {
      trending('').then(paint).catch(function () { say('Audius did not answer. Try again in a moment.'); });
    } else if (view === 'genres') {
      trending(genre).then(function (list) {
        if (!list.length) say('No ' + genre + ' tracks right now.');
        paint(list);
      }).catch(function () { say('Audius did not answer. Try again in a moment.'); });
    } else if (view === 'radio') {
      browserStations('', tag).then(function (list) {
        if (!list.length) say('No stations came back for that tag.');
        paint(list);
      }).catch(function () { say('The station directory did not answer.'); });
    }
  }

  function search() {
    var q = input.value.trim();
    if (!q) { load(); return; }
    say('Searching…');
    grid.hidden = false;
    queueWrap.hidden = true;
    chips.hidden = true;
    Promise.all([
      searchTracks(q).catch(function () { return []; }),
      browserStations(q, '').catch(function () { return []; })
    ]).then(function (parts) {
      var list = parts[0].concat(parts[1].slice(0, 12));
      if (!list.length) say('Nothing matched “' + q + '”.');
      paint(list);
    });
  }

  /* The tab lives in the hash so /music/#radio is a link you can send. */
  function showTab(name) {
    var tab = document.querySelector('.tab[data-view="' + name + '"]');
    if (!tab) return;
    document.querySelectorAll('.tab').forEach(function (t) { t.classList.toggle('active', t === tab); });
    view = name;
    input.value = '';
    load();
  }

  document.getElementById('tabs').addEventListener('click', function (e) {
    var tab = e.target.closest('.tab');
    if (!tab || tab.dataset.view === view) return;
    location.hash = tab.dataset.view;
  });

  window.addEventListener('hashchange', function () {
    showTab((location.hash || '#trending').slice(1));
  });

  document.getElementById('go').addEventListener('click', search);
  input.addEventListener('keydown', function (e) { if (e.key === 'Enter') search(); });

  function whenPlayerReady(fn) {
    if (window.GV && window.GV.player) { fn(); return; }
    setTimeout(function () { whenPlayerReady(fn); }, 60);
  }

  whenPlayerReady(function () {
    window.GV.player.onChange(function () {
      markPlaying();
      if (view === 'queue') paintQueue();
    });
    var start = (location.hash || '#trending').slice(1);
    if (document.querySelector('.tab[data-view="' + start + '"]')) showTab(start);
    else load();
  });
})();
</script>
</body>
</html>
